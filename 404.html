<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Redirección para SPA
    const path = window.location.pathname;
    const hashPath = path.replace('/fabrica-talentos', '');
    if (hashPath && hashPath !== '/') {
      window.location.replace('/fabrica-talentos/#' + hashPath);
    } else {
      window.location.replace('/fabrica-talentos/');
    }
  </script>
</head>
<body>
  <p>Redirecting to application...</p>
</body>
</html>
